scope_rules:
  - Any new item estimated above one focused working day requires a scope review.
  - New scope must state portfolio value, target role supported, estimated effort, forecast impact and V1 necessity.
  - ProcureGuard is the first scope to defer when the application-readiness forecast turns amber or red.
  - BCSentinel product development is not allowed to block portfolio readiness; only its defined portfolio-readiness package is mandatory.
  - Feature additions stop at feature freeze unless they fix a readiness-blocking defect.