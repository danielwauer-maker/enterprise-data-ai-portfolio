schema_version: 1
baseline:
  id: baseline-v1.0
  title: Enterprise Data & AI Portfolio 2027
  baseline_date: 2026-09-22
  start_date: 2026-09-22
  feature_freeze: 2027-02-14
  hardening_end: 2027-02-21
  application_ready_date: 2027-02-28
  status: active
  timezone: Europe/Berlin

progress_model:
  method: weighted_work_packages
  portfolio_scope_denominator: 100
  application_readiness_denominator: 95
  notes:
    - Portfolio Scope Progress includes ProcureGuard MVP and totals 100 weighted points.
    - Application Readiness excludes optional ProcureGuard MVP; mandatory work totals 95 points and is normalized to 100% readiness.
    - Partial subjective percentages are not used. Large packages must be decomposed if meaningful partial credit is needed.
  statuses: [planned, ready, in_progress, blocked, review, done]
  done_credit: 1.0
  other_status_credit: 0.0

