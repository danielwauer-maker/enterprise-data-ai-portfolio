        - {id: S01-ARCH-02, title: No-SUPER runtime evidence method defined, status: done}
      implementation:
        - {id: S01-IMP-01, title: Five BCSentinel permission sets implemented, status: done}
        - {id: S01-IMP-02, title: SCAN indirect DH Setup permission defect fixed in 1.0.2.25, status: done}
      automated_tests:
