schema_version: 1
website:
  id: enterprise-data-ai-portfolio-web
  name: Enterprise Data & AI Portfolio 2027
  status: foundation_live
  implementation:
    repository: danielwauer-maker/enterprise-data-ai-portfolio
    path: site
    framework: Next.js
    language: TypeScript
    styling: Tailwind CSS
    rendering: static_export
    hosting: GitHub Pages
    production_url: https://danielwauer-maker.github.io/enterprise-data-ai-portfolio/
    backend_required: false
    appearance:
      themes: [dark, light]
      initial_preference: system
      user_toggle: true
      persistence: browser_local_storage
    localization:
      languages: [de, en]
      default_preference: system
      fallback_language: en
      user_toggle: flags
      persistence: browser_local_storage

  principles:
    - Recruiter and technical decision-maker first.
    - Professional enterprise visual language rather than playful developer portfolio styling.
    - GitHub structured data is the source of truth.
    - Important metrics are generated or derived, never manually duplicated in UI code.
    - Progressive enhancement: the site becomes useful early and gains project depth over time.

  canonical_data_sources:
    portfolio: data/portfolio.yaml
    roadmap: data/roadmap.yaml
    metrics: data/metrics.json
    projects: data/projects/
    certifications: data/certifications.yaml
    business_impact: data/business-impact.yaml
    delivery_efficiency: data/delivery-efficiency.yaml
    effort_plan: data/effort-plan.yaml
    effort_log: data/effort-log.yaml
    translations: data/i18n/
    company_context: data/companies/nordwerk.yaml

  initial_vertical_slice:
    - executive_hero
    - flagship_platform
    - engineering_evidence
    - ai_assisted_engineering
    - target_architecture
    - phased_high_end_roadmap

  sections:
    - {id: hero, name: Executive Hero & Live High-End Status, source: control-center/program.json}
    - {id: building, name: BCSentinel + EOIP + Intelligence Capabilities, source: data/projects/}
    - {id: evidence, name: Engineering Evidence, source: data/sprint-details-v2.yaml}
    - {id: delivery, name: AI-Assisted Engineering, source: data/effort-log.yaml}
    - {id: architecture, name: High-End Target Architecture, source: PORTFOLIO_BIBLE.md}
    - {id: roadmap, name: Phased High-End Roadmap, source: data/high-end-program-v2.yaml}

  delivery_rules:
    - WEB-01 may start before its baseline date; the baseline dates remain frozen for plan-vs-actual evidence.
    - Website development must not block EOIP analytics delivery.
    - Initial slice should consume real data before visual polish expands.
    - No website-only copy of progress percentages, milestone dates or project statuses.
    - Public pages optimize for executive clarity; internal PM metrics remain available in repository data and sprint drilldowns.
    - Baseline-v1 cost, SPI, application-readiness and milestone-control metrics are not primary public-facing KPIs.
    - BCSentinel is the flagship commercial product; EOIP is the Data/Analytics R&D foundation; intelligence modules are platform capabilities rather than separate flagship products.
