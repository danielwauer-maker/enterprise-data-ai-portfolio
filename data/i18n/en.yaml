  delivery:
    eyebrow: AI-Assisted Delivery Efficiency
    title: Faster delivery, with the methodology visible.
    copy: Schedule acceleration is measured against the frozen baseline. Human effort is tracked separately, and cost values remain transparent scenarios until benchmark and actual-effort evidence exist.
