  project_cards:
    bcsentinel:
      role: Demonstrates production-oriented SaaS and software engineering in the Microsoft Dynamics 365 Business Central ecosystem.
      summary: A real SaaS-oriented monitoring and analysis product for Microsoft Dynamics 365 Business Central.
    eoip:
      role: Central enterprise analytics flagship and shared analytical data foundation for later portfolio projects.
      summary: A reproducible enterprise BI platform that transforms realistic ERP-style source data into a dimensional model, governed KPIs and decision-ready Power BI reporting.
    inventoryiq:
      role: Extends EOIP inventory analytics into deeper inventory policy, optimization and working-capital decision support.
      summary: An advanced inventory decision-support layer using the shared EOIP/NordWerk data foundation.
    marginguard:
      role: Demonstrates profitability analytics beyond revenue and gross margin by modeling cost-to-serve and margin leakage.
      summary: A profitability intelligence layer that attributes relevant cost components to customers and products and identifies traceable margin leakage.
    procureguard:
      role: Optional V1 extension demonstrating supplier, spend and purchase-price intelligence without blocking Application Readiness.
      summary: An optional procurement intelligence MVP based on the shared NordWerk data foundation.
