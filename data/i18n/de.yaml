  projects:
    bcsentinel:
      role: Belegt produktionsorientierte SaaS- und Software-Engineering-Fähigkeiten im Microsoft-Dynamics-365-Business-Central-Ökosystem.
      summary: Ein reales SaaS-orientiertes Monitoring- und Analyseprodukt für Microsoft Dynamics 365 Business Central.
    eoip:
      role: Zentrales Enterprise-Analytics-Flaggschiff und gemeinsame analytische Datenbasis für spätere Portfolio-Projekte.
      summary: Eine reproduzierbare Enterprise-BI-Plattform, die realistische ERP-nahe Quelldaten in ein dimensionales Modell, governede KPIs und entscheidungsreifes Power-BI-Reporting überführt.
    inventoryiq:
      role: Erweitert EOIP um tiefere Bestandsrichtlinien, Optimierungslogik und Working-Capital-Entscheidungsunterstützung.
      summary: Eine fortgeschrittene Inventory-Decision-Support-Schicht auf der gemeinsamen EOIP-/NordWerk-Datenbasis.
    marginguard:
      role: Belegt Profitabilitätsanalysen über Umsatz und Bruttomarge hinaus durch Cost-to-Serve- und Margin-Leakage-Modellierung.
      summary: Eine Profitability-Intelligence-Schicht, die relevante Kosten Kunden und Produkten zuordnet und nachvollziehbare Margin-Leakage identifiziert.
    procureguard:
      role: Optionale V1-Erweiterung für Lieferanten-, Spend- und Einkaufspreis-Intelligence, ohne die Application Readiness zu blockieren.
      summary: Ein optionales Procurement-Intelligence-MVP auf Basis der gemeinsamen NordWerk-Datenbasis.
